name: ci

# 記事を触る変更が入るたびに走る決定論的なゲート。
# ネットワークに依存する検査 (リンク生死・Zenn実態との突合) は patrol.yml に分ける。
on:
  push:
    branches: [main]
    paths: ['articles/**', 'books/**', 'tools/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['articles/**', 'books/**', 'tools/**', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  validate:
    name: frontmatter・構造の検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zenn の規則で検証
        run: node tools/validate-content.mjs
      - name: zenn-cli が記事を認識するか
        run: npx --yes zenn-cli@latest list:articles

  writing:
    name: クリシェ検査 (warn含め0件)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dead-cliche check
        run: |
          out=$(npx --yes github:BoxPistols/ux-writing-dead-cliche check articles/*.md books/*/*.md | tail -1)
          echo "$out"
          [ "$out" = "検出なし" ] || { echo "warn を含め 0 件の基準に達していません"; exit 1; }

  unpublish-guard:
    name: 公開中記事の取り下げ検出
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: published true→false を検出
        run: node tools/guard-unpublish.mjs "origin/${{ github.base_ref }}"
