name: patrol

# 外部の状態に依存する定期巡回。失敗しても記事の内容が壊れているわけではないため、
# push のたびには回さず週次と手動で回す (決定論的な検査は ci.yml)。
on:
  schedule:
    - cron: '0 21 * * 5'   # 土曜 06:00 JST
  workflow_dispatch:

jobs:
  links:
    name: 外部リンク生死 (404/410で失敗)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patrol-links.mjs

  published:
    name: published と Zenn 実態の整合
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/patrol-published.mjs
