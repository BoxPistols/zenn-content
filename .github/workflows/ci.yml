name: ci

# 記事を触る変更が入るたびに走る決定論的なゲート。
# ネットワークに依存する検査 (リンク生死・Zenn実態との突合) は patrol.yml に分ける。
on:
  push:
    branches: [main]
    paths: ['articles/**', 'books/**', 'tools/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['articles/**', 'books/**', 'tools/**', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  validate:
    name: frontmatter・構造の検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zenn の規則で検証
        run: node tools/validate-content.mjs
      - name: zenn-cli が記事を認識するか
        run: npx --yes zenn-cli@latest list:articles
      # 参照先の無い id (aria-labelledby / for など) を止める。見た目には現れず、
      # 支援技術にだけ影響するため、目視では見落とす。
      - name: コードブロックの参照検査
        run: node tools/validate-code-blocks.mjs

  writing:
    name: クリシェ検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 現在このリポジトリは検出0件を維持しているため --strict で回す。
      # 可読性のために warn 級の書式を意図的に使いたくなったら --strict を外し、
      # error 級のみを失敗条件にする (検出ゼロは文章の質を保証しない)。
      - name: dead-cliche check
        run: node tools/check-writing.mjs --strict

  unpublish-guard:
    name: 公開中記事の取り下げ検出
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: published true→false を検出
        run: node tools/guard-unpublish.mjs "origin/${{ github.base_ref }}"
